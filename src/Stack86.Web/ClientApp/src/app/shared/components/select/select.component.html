<select (change)="onChange($event)">
  @if (placeholder(); as ph) {
    <option value="" [selected]="value() === ''">{{ ph }}</option>
  }
  @for (opt of options(); track opt.value) {
    <option [value]="opt.value" [selected]="opt.value === value()" [disabled]="opt.disabled ?? false">
      {{ opt.label }}
    </option>
  }
</select>
