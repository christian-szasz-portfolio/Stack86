<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a8ad4"/>
      <stop offset="100%" style="stop-color:#007acc"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#grad)"/>
  <!-- Microchip pins -->
  <g stroke="white" stroke-width="1.6" stroke-linecap="round">
    <line x1="12" y1="8" x2="12" y2="11"/>
    <line x1="16" y1="8" x2="16" y2="11"/>
    <line x1="20" y1="8" x2="20" y2="11"/>
    <line x1="12" y1="21" x2="12" y2="24"/>
    <line x1="16" y1="21" x2="16" y2="24"/>
    <line x1="20" y1="21" x2="20" y2="24"/>
    <line x1="8" y1="12" x2="11" y2="12"/>
    <line x1="8" y1="16" x2="11" y2="16"/>
    <line x1="8" y1="20" x2="11" y2="20"/>
    <line x1="21" y1="12" x2="24" y2="12"/>
    <line x1="21" y1="16" x2="24" y2="16"/>
    <line x1="21" y1="20" x2="24" y2="20"/>
  </g>
  <!-- Chip body -->
  <rect x="11" y="11" width="10" height="10" rx="2" fill="none" stroke="white" stroke-width="2"/>
  <!-- Core -->
  <rect x="14" y="14" width="4" height="4" rx="1" fill="white"/>
</svg>
